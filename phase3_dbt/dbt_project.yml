name: 'recruiting_intel'
version: '1.0.0'
config-version: 2

# This profile name must match an entry in profiles.yml (kept in this same dir).
profile: 'recruiting_intel'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  recruiting_intel:
    # Layer-by-layer materialization strategy:
    #   staging      -> views  (cheap, always-fresh 1:1 wrappers on raw)
    #   intermediate -> views  (composable business logic, not queried directly)
    #   marts        -> tables (queried by BI + the ML feature build; worth materializing)
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

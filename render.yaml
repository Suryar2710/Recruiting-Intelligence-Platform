# Render Blueprint: one-click deploy of the Recruiting Intelligence Platform.
#
# Render Blueprints support service types web / pserv / worker / cron / keyvalue
# only -- there is NO declarable one-shot "job" type (One-Off Jobs are a runtime
# feature tied to an existing service's build artifact, not expressible here).
#
# So instead of a separate build job, the web service builds the warehouse on
# first boot before it starts serving (docker/web_entrypoint.sh): it waits for
# Postgres, builds the marts if they're empty (generate -> load -> dbt build),
# then execs uvicorn. This guarantees the API can't serve before the data it
# queries exists, and is idempotent so redeploys skip straight to serving. The
# three canonical models are baked into the image, so Postgres is the only
# external dependency.
#
# To deploy: New + -> Blueprint -> pick this repo. Render provisions the Postgres
# and the web service. Free-tier notes: first boot is slow (it runs the build),
# the service sleeps on idle, and the free managed Postgres expires after ~90
# days -- all fine for a portfolio demo.

databases:
  - name: recruiting-intel-db
    plan: free
    databaseName: recruiting_intel
    user: recruiting

services:
  - type: web
    name: recruiting-intel-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Build-if-empty then serve. Overrides the Dockerfile's default CMD.
    dockerCommand: /app/docker/web_entrypoint.sh
    # /docs is static (no DB), but uvicorn only starts AFTER the build finishes,
    # so a passing health check also means the warehouse is ready.
    healthCheckPath: /docs
    envVars:
      - key: PGHOST
        fromDatabase: { name: recruiting-intel-db, property: host }
      - key: PGPORT
        fromDatabase: { name: recruiting-intel-db, property: port }
      - key: PGUSER
        fromDatabase: { name: recruiting-intel-db, property: user }
      - key: PGPASSWORD
        fromDatabase: { name: recruiting-intel-db, property: password }
      - key: PGDATABASE
        fromDatabase: { name: recruiting-intel-db, property: database }
      - key: DBT_PROFILES_DIR
        value: /app/phase3_dbt
      # Smaller scale keeps the free-tier first-boot build within time/memory
      # limits while preserving every embedded signal.
      - key: PIPELINE_SCALE
        value: "0.25"
